name: Keepalive

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update keepalive marker
        run: date -u +%Y-%m-%d > .github/keepalive

      - name: Commit marker if changed
        run: |
          if git diff --quiet -- .github/keepalive; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          git commit -m 'chore: keep repository active'
          git push
