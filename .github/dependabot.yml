version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Skip PHP release candidates (e.g. 8.6.0RC5-apache-trixie).
      # Dependabot reads "8.6.0RC5" as a pre-release of 8.6.0, so ">= X.a, < X"
      # matches every alpha/beta/RC of X but not the stable X release.
      - dependency-name: php
        versions:
          - ">= 8.6.0.a, < 8.6.0"
          - ">= 8.7.0.a, < 8.7.0"
          - ">= 9.0.0.a, < 9.0.0"
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
