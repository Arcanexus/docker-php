version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the PHP 8.5 line: only patch bumps (8.5.x), no 8.6 / RCs
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
